name: Build FMCG-AuditPro Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. CHECKOUT
      # =========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. EXTRACT YOUR FMCG-AUDITPRO ZIP
      # =========================================================
      - name: Extract FMCG-AuditPro ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "fmcg-auditpro*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: FMCG-AuditPro ZIP was not found."
            exit 1
          fi

          echo "Using: $ZIP"

          mkdir -p extracted
          unzip -o "$ZIP" -d extracted

          PROJECT_DIR=$(find extracted -name package.json -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: package.json was not found inside ZIP."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          shopt -s dotglob
          cp -R "$PROJECT_DIR"/* .

          echo "Project successfully extracted."
          ls -la

      # =========================================================
      # 3. NODE
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # =========================================================
      # 4. JAVA 21
      #
      # IMPORTANT:
      # NO Gradle cache here.
      # The Android project does not exist yet at this point.
      # =========================================================
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Java and Node
        run: |
          java -version
          javac -version
          node --version
          npm --version

      # =========================================================
      # 5. INSTALL DEPENDENCIES
      # =========================================================
      - name: Install dependencies
        run: |
          npm install --legacy-peer-deps

          npm install \
            @capacitor/core \
            @capacitor/android \
            --legacy-peer-deps

          npm install \
            --save-dev @capacitor/cli \
            --legacy-peer-deps

      # =========================================================
      # 6. REQUIRE BACKEND URL
      # =========================================================
      - name: Check backend URL
        shell: bash
        env:
          BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo ""
            echo "======================================================"
            echo "ERROR: VITE_BACKEND_URL secret is missing."
            echo "======================================================"
            echo ""
            echo "Go to:"
            echo "GitHub → Settings → Secrets and variables → Actions"
            echo ""
            echo "Create repository secret:"
            echo ""
            echo "Name:"
            echo "VITE_BACKEND_URL"
            echo ""
            echo "Value:"
            echo "https://YOUR-DEPLOYED-BACKEND-URL"
            echo ""
            exit 1
          fi

          echo "Backend URL is configured."

      # =========================================================
      # 7. CONNECT FRONTEND API CALLS TO BACKEND
      #
      # Your current source uses:
      #
      # fetch('/api/analyze')
      # fetch('/api/inspections')
      #
      # Inside an APK these must go to the deployed backend.
      # We install a small fetch bridge instead of modifying
      # every page manually.
      # =========================================================
      - name: Configure mobile API bridge
        env:
          BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path

          main = Path("src/main.tsx")

          original = main.read_text()

          bridge = r'''
          /*
           * FMCG-AuditPro Android/API bridge.
           * Relative /api/* requests are redirected to the
           * deployed backend configured by VITE_BACKEND_URL.
           */

          const FMCG_API_BASE =
            (import.meta.env.VITE_BACKEND_URL || "").replace(/\/+$/, "");

          if (FMCG_API_BASE) {
            const nativeFetch = window.fetch.bind(window);

            window.fetch = (input: RequestInfo | URL, init?: RequestInit) => {
              if (typeof input === "string" && input.startsWith("/api/")) {
                input = FMCG_API_BASE + input;
              } else if (input instanceof URL && input.pathname.startsWith("/api/")) {
                input = new URL(FMCG_API_BASE + input.pathname + input.search);
              }

              return nativeFetch(input, init);
            };
          }
          '''

          # Avoid duplicate bridge if workflow is ever rerun.
          if "FMCG_API_BASE" not in original:
              main.write_text(bridge + "\n" + original)

          print("Mobile API bridge installed.")
          PY

      # =========================================================
      # 8. BUILD WEB APPLICATION
      # =========================================================
      - name: Build web application
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
        run: |
          npm run build

          if [ ! -d "dist" ]; then
            echo "ERROR: dist directory was not created."
            exit 1
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not created."
            exit 1
          fi

          echo "Web build successful."

      # =========================================================
      # 9. CREATE CAPACITOR CONFIG
      # =========================================================
      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.fmcg.auditpro',
            appName: 'FMCG-AuditPro',
            webDir: 'dist',

            android: {
              allowMixedContent: false
            }
          };

          export default config;
          EOF

      # =========================================================
      # 10. CREATE ANDROID PROJECT
      # =========================================================
      - name: Create Android project
        run: |
          rm -rf android

          npx cap add android

          npx cap sync android

      # =========================================================
      # 11. VERIFY ANDROID PROJECT
      # =========================================================
      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -d android/app

          chmod +x android/gradlew

          cd android

          ./gradlew --version

      # =========================================================
      # 12. BUILD DEBUG APK
      # =========================================================
      - name: Build Debug APK
        run: |
          cd android

          chmod +x gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      # =========================================================
      # 13. VERIFY APK
      # =========================================================
      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "FMCG-AuditPro APK CREATED SUCCESSFULLY"
          echo "=============================================="
          ls -lh "$APK"

      # =========================================================
      # 14. UPLOAD APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FMCG-AuditPro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
