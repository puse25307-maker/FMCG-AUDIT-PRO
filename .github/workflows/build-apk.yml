name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o "fmcg-auditpro*.zip"
          # Move files to root if the zip contained a top-level directory
          if [ ! -f package.json ]; then
            DIR=$(find . -mindepth 2 -name "package.json" -printf '%h\n' | head -n 1)
            if [ -n "$DIR" ]; then
              shopt -s dotglob
              mv "$DIR"/* .
            fi
          fi
          ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core @capacitor/android --legacy-peer-deps
          npm install -D @capacitor/cli --legacy-peer-deps

      - name: Build Web Assets
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL || 'https://your-backend-url.com' }}
        run: npm run build

      - name: Initialize and Sync Capacitor
        run: |
          npx cap init FMCG-AuditPro com.fmcg.auditpro --web-dir dist
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMCG-AuditPro-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
